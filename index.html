
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishanth T. | Personal Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b1020, #253568);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            width: 80%;
            max-width: 600px;
            padding: 35px;
            background: #151d33;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 40px;
            color: #9aaaff;
            margin-bottom: 10px;
        }

        h2 {
            color: #dce2ff;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            color: #c4cbe0;
        }

        .details {
            margin-top: 25px;
            padding: 20px;
            background: #10172a;
            border-radius: 15px;
        }

        .details p {
            border-bottom: 1px solid #303b5b;
            padding-bottom: 10px;
        }

        .details p:last-child {
            border-bottom: none;
        }

        footer {
            margin-top: 25px;
            color: #9aaaff;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .profile {
                width: 85%;
                padding: 20px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>Nishanth T.</h1>
        <h2>Personal Profile</h2>

        <p>
            Hello! I am Nishanth T.
            Welcome to my personal webpage.
        </p>

        <div class="details">
            <p><strong>Name:</strong> Nishanth T.</p>
            <p><strong>Age:</strong> 18 years</p>

            <p><strong>Occupation:</strong> Student</p>
        </div>

        <footer>
            &copy; 2026 Nishanth T. | Personal Website
        </footer>

</body>
</html>
